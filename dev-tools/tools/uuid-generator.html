<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UUID Generator — Dev Tools</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="container">
    <a class="back-link" href="../index.html">← All tools</a>
    <header class="site-header">
      <div>
        <h1 class="site-title"><span class="logo">🆔</span> UUID Generator</h1>
        <p class="subtitle">Generate RFC 4122 version 4 UUIDs.</p>
      </div>
    </header>

    <div class="panel">
      <div class="row">
        <div class="col" style="flex: 0 1 160px;">
          <label class="field-label" for="count">How many</label>
          <input type="number" id="count" value="1" min="1" max="1000" />
        </div>
        <div class="col" style="display:flex; align-items:flex-end;">
          <div class="checkbox-row" style="margin:0;">
            <input type="checkbox" id="uppercase" />
            <label for="uppercase">Uppercase</label>
          </div>
          <div class="checkbox-row" style="margin:0 0 0 16px;">
            <input type="checkbox" id="braces" />
            <label for="braces">Wrap in { }</label>
          </div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn" id="genBtn">Generate</button>
        <button class="btn secondary" id="copyBtn">📋 Copy all</button>
      </div>
    </div>

    <div class="panel">
      <label class="field-label">Result</label>
      <div class="output mono-big" id="output"></div>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="uuid-generator.js"></script>
</body>
</html>
