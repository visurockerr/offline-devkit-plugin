<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator — Dev Tools</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="container">
    <a class="back-link" href="../index.html">← All tools</a>
    <header class="site-header">
      <div>
        <h1 class="site-title"><span class="logo">🔑</span> Password Generator</h1>
        <p class="subtitle">Generate strong, random passwords locally.</p>
      </div>
    </header>

    <div class="panel">
      <div class="row">
        <div class="col" style="flex:0 1 220px;">
          <label class="field-label" for="length">Length: <span id="lenLabel">16</span></label>
          <input type="range" id="length" min="4" max="64" value="16" style="width:100%;" />
        </div>
      </div>
      <div class="checkbox-row"><input type="checkbox" id="lower" checked /><label for="lower">Lowercase (a-z)</label></div>
      <div class="checkbox-row"><input type="checkbox" id="upper" checked /><label for="upper">Uppercase (A-Z)</label></div>
      <div class="checkbox-row"><input type="checkbox" id="digits" checked /><label for="digits">Digits (0-9)</label></div>
      <div class="checkbox-row"><input type="checkbox" id="symbols" checked /><label for="symbols">Symbols (!@#$…)</label></div>
      <div class="checkbox-row"><input type="checkbox" id="noAmbig" /><label for="noAmbig">Avoid ambiguous characters (0 O l 1 I)</label></div>
      <div class="btn-row">
        <button class="btn" id="genBtn">Generate</button>
        <button class="btn secondary" id="copyBtn">📋 Copy</button>
      </div>
      <div class="error" id="error"></div>
    </div>

    <div class="panel">
      <label class="field-label">Password</label>
      <div class="output mono-big" id="output"></div>
      <div class="hint" id="strength"></div>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="password.js"></script>
</body>
</html>
